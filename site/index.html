<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Material de Big Data — GDBD &amp; PDN</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
      }
      main { max-width: 42rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.9rem; margin-bottom: 0.25rem; }
      p.sub { opacity: 0.7; margin-top: 0; }
      .cards { display: grid; gap: 1rem; margin-top: 2.5rem; grid-template-columns: 1fr 1fr; }
      @media (max-width: 36rem) { .cards { grid-template-columns: 1fr; } }
      a.card {
        display: block;
        padding: 1.5rem;
        border-radius: 0.75rem;
        background: #1e293b;
        color: inherit;
        text-decoration: none;
        border: 1px solid #334155;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      a.card:hover { transform: translateY(-3px); border-color: #38bdf8; }
      a.card strong { display: block; font-size: 1.2rem; margin-bottom: 0.35rem; }
      a.card span { opacity: 0.75; font-size: 0.95rem; }
      footer { margin-top: 2.5rem; font-size: 0.85rem; opacity: 0.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Material de Big Data</h1>
      <p class="sub">Disciplinas ministradas por Bernardo Costa</p>
      <div class="cards">
        <a class="card" href="./gdbd/">
          <strong>GDBD</strong>
          <span>Gerenciamento de Dados para Big Data</span>
        </a>
        <a class="card" href="./pdn/">
          <strong>PDN</strong>
          <span>Processamento de Big Data na Nuvem</span>
        </a>
      </div>
      <footer>Slides em Slidev · publicado via GitHub Pages</footer>
    </main>
  </body>
</html>
